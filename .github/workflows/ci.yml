name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Electron runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb

      - run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests (Linux, headless X)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: E2E tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Package
        run: npm run build && npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: printpilot-${{ matrix.os }}
          path: release/*
          retention-days: 14
