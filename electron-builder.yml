appId: io.github.qtrcipher.printpilot
productName: PrintPilot
copyright: Copyright © 2026 PrintPilot contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - adapters/** # adapter manifests are data files read at runtime (design doc §4)
  - package.json

# No publish config: packaging always runs with --publish never (RELEASE.md);
# releases are built by the tag-triggered workflow (.github/workflows/release.yml).

win:
  icon: build/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage
    - deb
