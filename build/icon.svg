<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PrintPilot icon: printer glyph + gamepad D-pad motif.
       Accent #60A5FA on #0F172A (design doc §8 dark palette). -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0F172A"/>

  <!-- paper input sheet -->
  <rect x="168" y="112" width="176" height="60" rx="10" fill="#60A5FA"/>
  <!-- printer body -->
  <rect x="112" y="190" width="288" height="120" rx="24" fill="#60A5FA"/>
  <!-- paper output sheet -->
  <rect x="168" y="296" width="176" height="104" rx="10" fill="#F8FAFC"/>
  <rect x="192" y="330" width="128" height="14" rx="7" fill="#0F172A"/>
  <rect x="192" y="360" width="88" height="14" rx="7" fill="#0F172A"/>

  <!-- D-pad on the printer body -->
  <g fill="#0F172A">
    <rect x="214" y="236" width="84" height="28" rx="8"/>
    <rect x="242" y="208" width="28" height="84" rx="8"/>
  </g>
</svg>
